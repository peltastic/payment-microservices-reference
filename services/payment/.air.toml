root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -tags nomsgpack -p 2 -o ./tmp/main ./cmd/api"
bin = "./tmp/main"
entrypoint = ["./tmp/main"]
include_ext = ["go", "mod", "sum"]
exclude_dir = ["tmp", "vendor"]
exclude_unchanged = true
poll = true
poll_interval = 500
delay = 1000
stop_on_error = true
