global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ['gateway:3000']
    metrics_path: /metrics

  - job_name: auth
    static_configs:
      - targets: ['auth:4001']
    metrics_path: /metrics
    
  - job_name: payment
    static_configs:
      - targets: ['payment:4002']
    metrics_path: /metrics

  - job_name: ledger
    static_configs:
      - targets: ['ledger:4003']
    metrics_path: /metrics

  - job_name: webhook
    static_configs:
      - targets: ['webhook:4004']
    metrics_path: /metrics
